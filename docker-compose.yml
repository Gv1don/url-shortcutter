services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: shortcutter-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    networks:
      - shortcutter
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: shortcutter-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - shortcutter
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: shortcutter-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: shortcutter
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_USER: shortcutter
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - shortcutter
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata:

networks:
  shortcutter:
    driver: bridge
